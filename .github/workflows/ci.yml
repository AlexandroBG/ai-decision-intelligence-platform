name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pinned pip
        run: python -m pip install "pip==26.2.1"

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Install project without resolving dependencies
        run: python -m pip install -e . --no-deps

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

  lock-freshness:
    name: Verify Dependency Locks
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pinned pip
        run: python -m pip install "pip==26.2.1"

      - name: Install pinned pip-tools
        run: python -m pip install "pip-tools==7.6.1"

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Regenerate and verify lock files
        run: |
          python -m piptools compile pyproject.toml --strip-extras --output-file requirements.lock --resolver backtracking
          python -m piptools compile pyproject.toml --extra dev --strip-extras --output-file requirements-dev.lock --resolver backtracking
          git diff --exit-code -- requirements.lock requirements-dev.lock

  docker:
    name: Build Docker Images
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build API image
        run: docker build -f Dockerfile.api -t decisionai-api:ci .

      - name: Build UI image
        run: docker build -f Dockerfile.ui -t decisionai-ui:ci .
