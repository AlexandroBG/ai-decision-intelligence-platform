services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: decisionai-api:phase16
    container_name: decisionai-api
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      DECISIONAI_ALLOWED_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
    ports:
      - "8001:8000"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: decisionai-ui:phase16
    container_name: decisionai-ui
    environment:
      DECISIONAI_API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped