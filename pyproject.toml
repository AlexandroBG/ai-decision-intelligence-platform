[build-system]
requires = [
    "setuptools==84.0.0",
]
build-backend = "setuptools.build_meta"


[project]
name = "ai-decision-intelligence-platform"
version = "0.1.0"
description = "AI-powered decision intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "streamlit",
    "httpx",
    "google-genai",
    "openai",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]


[tool.setuptools.packages.find]
where = ["."]
include = [
    "app",
    "app.*",
]
exclude = [
    "data",
    "data.*",
    "artifacts",
    "artifacts.*",
    "tests",
    "tests.*",
    "scripts",
    "scripts.*",
]
